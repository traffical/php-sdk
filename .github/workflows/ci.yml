name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: "PHP ${{ matrix.php }} — tests + conformance"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout (with sdk-spec submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run test suite (unit + conformance + integration)
        run: composer test

  spec-pin-gate:
    name: "Spec pin freshness"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with sdk-spec submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Stale-pin gate: fail when the pinned tests/sdk-spec submodule is behind
      # the latest published spec tag, so a future spec release is not silently
      # missed. The submodule is currently pinned at v0.8.0.
      - name: Fail if the pinned spec is behind the latest tag
        working-directory: tests/sdk-spec
        run: |
          git fetch --tags --force --quiet origin || true
          latest_tag="$(git tag --sort=-v:refname | head -n1)"
          if [ -z "$latest_tag" ]; then
            echo "No spec tags found; skipping freshness gate."
            exit 0
          fi
          pinned="$(git rev-parse HEAD)"
          latest="$(git rev-list -n1 "$latest_tag")"
          echo "Pinned spec:  $pinned"
          echo "Latest tag:   $latest_tag ($latest)"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::Pinned sdk-spec is behind the latest tag $latest_tag. Bump the tests/sdk-spec submodule."
            exit 1
          fi

  static-analysis:
    name: "Static analysis + code style"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level max)
        run: composer phpstan

      - name: PHP-CS-Fixer (PSR-12, dry run)
        run: composer cs-check

  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
